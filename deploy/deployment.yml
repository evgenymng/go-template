apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-template
  labels:
    app.kubernetes.io/name: go-template
    drn: "3390"
    dnb_environment: production
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: go-template
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: go-template
        drn: "3390"
        dnb_environment: production
    spec:
      containers:
        - name: crawler
          image: go-template:latest
          imagePullPolicy: Always
          command: ["/go-template/app"]
          envFrom:
            - configMapRef:
                name: go-template-config
          ports:
            - name: http-api
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 1000m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /ping
              port: 80
            periodSeconds: 10
            initialDelaySeconds: 5
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /ping
              port: 80
            periodSeconds: 10
            initialDelaySeconds: 20
