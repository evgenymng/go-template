{{- if .Values.otelCollector.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-template.fullname" . }}-otel-collector
  labels:
    {{- include "go-template.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
spec:
  type: {{ .Values.otelCollector.service.type }}
  ports:
    - port: {{ .Values.otelCollector.service.port }}
      targetPort: otlp-grpc
      protocol: TCP
      name: otlp-grpc
    - port: 8889
      targetPort: prometheus
      protocol: TCP
      name: prometheus
  selector:
    {{- include "go-template.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
{{- end }}