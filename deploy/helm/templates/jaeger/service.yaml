{{- if .Values.jaeger.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-template.fullname" . }}-jaeger
  labels:
    {{- include "go-template.labels" . | nindent 4 }}
    app.kubernetes.io/component: jaeger
spec:
  type: {{ .Values.jaeger.service.type }}
  ports:
    - port: 14250
      targetPort: jaeger-grpc
      protocol: TCP
      name: jaeger-grpc
    - port: 14268
      targetPort: jaeger-http
      protocol: TCP
      name: jaeger-http
    - port: 16686
      targetPort: jaeger-ui
      protocol: TCP
      name: jaeger-ui
  selector:
    {{- include "go-template.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: jaeger
{{- end }}