apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-template.fullname" . }}
  labels:
    {{- include "go-template.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.goTemplate.service.annotations | nindent 4 }}
spec:
  type: {{ .Values.goTemplate.service.type }}
  ports:
    - port: {{ .Values.goTemplate.service.port }}
      targetPort: http-api
      protocol: TCP
      name: http-api
  selector:
    {{- include "go-template.selectorLabels" . | nindent 4 }}