receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:

exporters:
  prometheus: # Pull model
    endpoint: 0.0.0.0:8889
  loki: # Push model
    endpoint: http://loki:3100/loki/api/v1/push
  otlp/jaeger: # Push model
    endpoint: jaeger:14250
    tls:
      insecure: true
  debug:

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [loki]
