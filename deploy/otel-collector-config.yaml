receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:

exporters:
  prometheus: # Pull model
    endpoint: 0.0.0.0:8889
  loki: # Push model
    endpoint: http://loki:3100/loki/api/v1/push
  debug: # Required for traces (or use another exporter like otlphttp)

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug] # Or your trace backend (e.g., otlphttp, jaeger)
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [loki]
